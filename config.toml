# Generic build configuration, loaded for every architecture.
# Fields: type (bool|int|string), default, group, optional help, optional
# header (export to config.h). Arch config.toml files may add options or
# override an option's default.

[ARCH]
type = "string"
default = "riscv64"
group = "arch"
header = "CONFIG_ARCH"
help = "Target architecture (riscv64, riscv32, arm64)"

[PLATFORM]
type = "string"
default = "any"
group = "arch"
help = "Target platform/board"

[CROSS_COMPILE]
type = "string"
default = "{ARCH}-unknown-linux-gnu-"
group = "compiler"
help = "Cross-toolchain prefix"

[OPT]
type = "string"
default = "-O0"
group = "compiler"
help = "Compiler optimisation level"

[CONFIG_GCOV]
type = "bool"
default = false
group = "build"
header = true
help = "Coverage instrumentation"

[CONFIG_DEBUG_OUTPUT]
type = "bool"
default = false
group = "build"
header = true
help = "Verbose kernel log output"

[CONFIG_INITCONST_STR]
type = "bool"
default = false
group = "build"
header = true
help = "Move const strings into the freeable .init section"

[CONFIG_VMM]
type = "bool"
default = true
group = "build"
header = true
help = "Virtual machine monitor"

[CONFIG_TOOLS_DEBUG]
type = "bool"
default = false
group = "build"
help = "Build host tools with debug info"

[QEMU_CPUS]
type = "int"
default = 2
group = "qemu"
help = "Number of guest CPUs for 'make qemu'"

[QEMU_APPEND]
type = "string"
default = ""
group = "qemu"
help = "Extra kernel command line for QEMU"

[QEMU_DISPLAY]
type = "string"
default = "none"
group = "qemu"
help = "QEMU display backend"

[QEMU_SERIAL]
type = "string"
default = "stdio"
group = "qemu"
help = "QEMU serial backend"
